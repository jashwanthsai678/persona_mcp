<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JAHA{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer base {
      body { @apply font-sans bg-zinc-950 text-zinc-300 antialiased; }
      label { @apply block text-sm font-medium text-zinc-200 mt-4 mb-1.5; }
      textarea { @apply min-h-[140px] font-sans; }
    }
    @layer components {
      .card {
        @apply rounded-2xl border border-zinc-800 bg-zinc-900/30 backdrop-blur-sm p-6 mb-6;
      }
      .field {
        @apply w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-100 text-sm
               placeholder:text-zinc-600 focus:outline-none focus:border-indigo-500/60 transition-colors duration-200;
      }
      .btn {
        @apply inline-flex items-center justify-center px-4 py-2 rounded-lg text-sm font-semibold
               transition-all duration-200 active:scale-95 cursor-pointer no-underline;
      }
      .btn-primary { @apply btn bg-white text-zinc-950 hover:bg-zinc-200; }
      .btn-secondary { @apply btn bg-zinc-900 text-zinc-300 border border-zinc-800 hover:bg-zinc-800; }
      .btn-ghost { @apply btn bg-transparent text-zinc-300 hover:bg-zinc-900 hover:text-white; }
      .btn-danger { @apply btn bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20; }
      .status-pill { @apply inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold; }
      .status-ready { @apply bg-emerald-500/10 text-emerald-400; }
      .status-processing { @apply bg-amber-500/10 text-amber-400; }
      .status-created { @apply bg-zinc-500/10 text-zinc-400; }
      .status-error { @apply bg-red-500/10 text-red-400; }
      .mcp-link {
        @apply block p-3 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300 text-sm break-all;
      }
      .persona-row {
        @apply flex items-center justify-between py-3 border-b border-zinc-800 last:border-b-0;
      }
    }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid rgb(129 140 248); outline-offset: 2px;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="sticky top-0 z-50 backdrop-blur-md bg-zinc-950/70 border-b border-white/5">
    <nav class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="/" class="text-white font-semibold tracking-tight no-underline">JAHA</a>
      {% if user %}
        <form method="post" action="/logout" class="flex items-center gap-3 m-0">
          <span class="text-zinc-500 text-sm">{{ user.email }}</span>
          <button type="submit" class="btn-secondary">Log out</button>
        </form>
      {% else %}
        <div class="flex items-center gap-2">
          <a href="/login" class="btn-ghost">Log in</a>
          <a href="/signup" class="btn-primary">Sign up</a>
        </div>
      {% endif %}
    </nav>
  </header>
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
