<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Persona MCP{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 64px;
      line-height: 1.5;
    }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    nav a { text-decoration: none; font-weight: 600; }
    .card { border: 1px solid rgba(128,128,128,0.3); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input[type=text], input[type=email], input[type=password], textarea {
      width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(128,128,128,0.4);
      font-size: 14px; box-sizing: border-box;
    }
    textarea { min-height: 120px; font-family: inherit; }
    button, .btn {
      display: inline-block; margin-top: 14px; padding: 8px 16px; border-radius: 6px; border: none;
      background: #2563eb; color: white; font-weight: 600; cursor: pointer; font-size: 14px;
      text-decoration: none;
    }
    button.secondary, .btn.secondary { background: transparent; color: #2563eb; border: 1px solid #2563eb; }
    button.danger { background: #dc2626; }
    .error { color: #dc2626; font-size: 14px; margin-top: 8px; }
    .muted { color: #888; font-size: 13px; }
    .status-pill {
      display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    }
    .status-ready { background: #16a34a22; color: #16a34a; }
    .status-processing { background: #d9770622; color: #d97706; }
    .status-created { background: #6b728022; color: #6b7280; }
    .status-error { background: #dc262622; color: #dc2626; }
    code.mcp-link { display: block; padding: 10px; background: rgba(128,128,128,0.1); border-radius: 6px; word-break: break-all; font-size: 13px; }
    .persona-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,0.15); }
    .persona-row:last-child { border-bottom: none; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/">Persona MCP</a>
    {% if user %}
      <form method="post" action="/logout" style="margin:0;">
        <span class="muted">{{ user.email }}</span>
        <button type="submit" class="secondary" style="margin-left:10px; margin-top:0;">Log out</button>
      </form>
    {% else %}
      <span>
        <a href="/login" class="btn secondary" style="margin-top:0;">Log in</a>
        <a href="/signup" class="btn" style="margin-top:0;">Sign up</a>
      </span>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
